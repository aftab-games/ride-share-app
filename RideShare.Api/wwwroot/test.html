
<!DOCTYPE html>
<html>
<head>
    <title>RideHub Connection Test</title>
</head>
<body>
    <h2>RideHub Connection Test</h2>
    <p>Open the browser console (F12) to see connection logs.</p>

    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
    <script>
    const connection = new signalR.HubConnectionBuilder()
        .withUrl("/hubs/ride")
        .build();

    connection.on("RideRequested", (ride) => console.log("New ride requested:", ride));
    connection.on("RideAccepted", (rideId, driverId) => console.log("Ride accepted:", rideId, "by driver:", driverId));
    connection.on("RideAcceptFailed", (rideId) => console.log("Failed to accept ride:", rideId));

    connection.start()
        .then(() => {
            console.log("Connected.");
            const driverId = "8c711c9e-3a5c-4ff1-bdbb-0bddc16c5f28"; // your real Driver id from earlier
            return connection.invoke("RegisterAsDriver", driverId);
        })
        .then(() => console.log("Registered as driver."))
        .catch(err => console.error("Error:", err));

    // Expose for manual testing from the browser console:
    window.acceptRide = (rideId, driverId) => connection.invoke("AcceptRide", rideId, driverId);
    window.setAvailable = (driverId) => connection.invoke("SetAvailable", driverId);
    window.updateLocation = (driverId, lat, lng) => connection.invoke("UpdateLocation", driverId, lat, lng);
    </script>
</body>
</html>
